<style>
:root{
  color-scheme: dark;
  --bg:#121214; --bg2:#0d0d0f; --panel:#18181b; --raise:#202024; --raise2:#28282d;
  --line:#2b2b31; --line2:#3a3a41; --text:#f3f3f4; --muted:#93939c; --dim:#62626b;
  --red:#e3262f; --red2:#ff4a52; --redglow:rgba(227,38,47,.35);
  --display:'Archivo','Arial Narrow',Impact,system-ui,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--red2);outline-offset:2px}

/* ---------- loader ---------- */
#loader{position:fixed;inset:0;z-index:50;background:var(--bg2);display:grid;place-items:center;transition:opacity .7s var(--ease),transform .9s var(--ease)}
#loader.done{opacity:0;transform:translateY(-3%);pointer-events:none}
.lwrap{display:grid;gap:18px;justify-items:center;padding-inline:16px}
.lmark{font-family:var(--display);font-stretch:125%;font-weight:900;font-size:clamp(30px,6vw,54px);letter-spacing:-.01em;line-height:1}
.lmark b{color:var(--red)}
.lbar{width:min(280px,70vw);height:2px;background:var(--line);overflow:hidden;border-radius:2px}
.lbar i{display:block;height:100%;width:0;background:var(--red);box-shadow:0 0 12px var(--red);transition:width .25s linear}
.lpct{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* ---------- shell ---------- */
.app{height:100%;display:grid;grid-template-rows:auto 1fr}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 20px;background:#161619;border-bottom:1px solid var(--line);position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:10px;color:var(--text);text-decoration:none}
.brand svg{width:34px;height:34px;flex:none}
.brand span{font-family:var(--display);font-stretch:125%;font-weight:900;font-size:19px;letter-spacing:-.01em;line-height:1}
.brand span b{display:block;font-family:var(--mono);font-stretch:100%;font-weight:600;font-size:9px;letter-spacing:.42em;color:var(--muted);margin-top:4px}
.nav{display:flex;align-items:center;gap:6px}
.nbtn{display:grid;justify-items:center;gap:3px;padding:6px 12px;border-radius:10px;color:var(--muted);font-size:12px;font-weight:600;position:relative;transition:color .2s,background .2s}
.nbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nbtn:hover{color:var(--text);background:var(--raise)}
.nbtn[aria-pressed="true"]{color:var(--text)}
.nbtn[aria-pressed="true"] svg{stroke:var(--red2);filter:drop-shadow(0 0 6px var(--redglow))}
.nbtn em{position:absolute;top:2px;right:8px;font-style:normal;font-family:var(--mono);font-size:9px;background:var(--red);color:#fff;border-radius:8px;padding:1px 5px;min-width:16px;text-align:center}
.nbtn em:empty,.nbtn em[data-n="0"]{display:none}
.cta{margin-left:8px;background:var(--red);color:#fff;font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:11px 16px;border-radius:9px;box-shadow:0 6px 24px -8px var(--red);transition:transform .25s var(--ease),background .2s,box-shadow .25s}
.cta:hover{background:var(--red2);transform:translateY(-1px);box-shadow:0 10px 30px -8px var(--red2)}
.cta:active{transform:translateY(1px)}

.main{display:grid;grid-template-columns:1fr 392px;min-height:0}

/* ---------- stage ---------- */
.stage{position:relative;min-height:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 62%,#29292f 0%,#17171a 46%,#0d0d0f 100%)}
.canvasWrap{position:absolute;inset:0;z-index:1}
.canvasWrap canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
.canvasWrap canvas:active{cursor:grabbing}
.bgword{position:absolute;left:0;right:0;top:46%;transform:translateY(-50%);z-index:0;text-align:center;white-space:nowrap;pointer-events:none;
  font-family:var(--display);font-stretch:125%;font-weight:900;font-size:clamp(110px,19vw,360px);line-height:.8;letter-spacing:-.03em;
  color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.075)}
.bgword span{display:inline-block;transition:transform .9s var(--ease),opacity .6s}
.bgword.out span{transform:translateY(40%);opacity:0}
.ovl{position:absolute;z-index:3;pointer-events:none}
.ovl > *{pointer-events:auto}
.tl{left:24px;top:20px;display:grid;gap:20px;max-width:min(520px,70%)}
.tr{right:20px;top:20px}

.ctabs{position:relative;display:flex;gap:26px;padding-bottom:9px}
.ctabs button{font-weight:700;font-size:15px;color:var(--muted);transition:color .2s}
.ctabs button[aria-selected="true"]{color:var(--text)}
.ctabs button:hover{color:var(--text)}
.ctabs .ind{position:absolute;bottom:0;height:2px;background:var(--red);border-radius:2px;box-shadow:0 0 10px var(--red);transition:left .5s var(--ease),width .5s var(--ease)}
.mpick{display:flex;flex-wrap:wrap;gap:6px;margin-top:-8px}
.mpick button{display:flex;align-items:center;gap:7px;padding:6px 11px 6px 8px;border-radius:30px;font-size:12.5px;font-weight:700;color:var(--muted);background:rgba(24,24,27,.6);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:color .2s,border-color .2s,background .2s}
.mpick button:hover{color:var(--text);border-color:var(--line2)}
.mpick button[aria-pressed="true"]{color:var(--text);border-color:var(--red);background:rgba(227,38,47,.14)}
.mpick button i{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.mpick button[aria-pressed="true"] i{background:var(--red2);box-shadow:0 0 8px var(--red2)}
.mpick button small{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--red2);font-weight:600}
.mpick button:disabled{opacity:.45;cursor:progress}
.credit{position:absolute;z-index:3;right:20px;bottom:104px;max-width:420px;text-align:right;font-size:10.5px;line-height:1.4;color:var(--dim)}
.credit a{color:var(--muted)}
.mload{position:absolute;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;gap:10px;justify-items:center;pointer-events:none;opacity:0;transition:opacity .4s}
.mload.on{opacity:1}
.mload .lbar{width:200px}
.hero{pointer-events:none}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.hero h1{margin:6px 0 12px;font-family:var(--display);font-stretch:125%;font-weight:850;font-size:clamp(30px,4.2vw,56px);line-height:.92;letter-spacing:-.02em;text-wrap:balance}
.hero h1 .wd{display:inline-block;white-space:nowrap}
.hero h1 .ch{display:inline-block;animation:chIn .8s var(--ease) both}
@keyframes chIn{from{transform:translateY(55%) skewX(-8deg);opacity:0;filter:blur(6px)}to{transform:none;opacity:1;filter:none}}
.chip{display:inline-flex;align-items:center;gap:9px;padding:6px 12px 6px 7px;border-radius:30px;background:rgba(24,24,27,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);font-size:13px;font-weight:600}
.chip i{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 -3px 6px rgba(0,0,0,.35),inset 0 2px 3px rgba(255,255,255,.35);transition:background .6s}
.chip small{color:var(--muted);font-weight:500}

.views{display:flex;gap:4px;padding:4px;border-radius:12px;background:rgba(24,24,27,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line)}
.views button{font-size:12px;font-weight:600;color:var(--muted);padding:7px 11px;border-radius:8px;transition:background .2s,color .2s}
.views button:hover{color:var(--text)}
.views button.on{background:var(--raise2);color:var(--text)}
.hint{position:absolute;z-index:3;left:24px;bottom:104px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);pointer-events:none}

.specbar{position:absolute;z-index:3;left:20px;right:20px;bottom:18px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(0,1.4fr);gap:1px;border-radius:14px;overflow:hidden;background:var(--line);border:1px solid var(--line);box-shadow:0 20px 50px -20px rgba(0,0,0,.8)}
.spec{background:rgba(22,22,25,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:11px 16px;display:grid;gap:2px;min-width:0}
.spec label{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.spec output{font-family:var(--display);font-stretch:110%;font-weight:750;font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap}
.spec output small{font-family:var(--body);font-stretch:100%;font-weight:500;font-size:12px;color:var(--muted);margin-left:3px}
.spec.price{background:rgba(227,38,47,.13)}
.spec.price output{color:#fff}
.spec .delta{font-family:var(--mono);font-size:10px;color:var(--red2);min-height:13px;transition:opacity .4s}

/* ---------- panel ---------- */
.panel{position:relative;background:var(--panel);border-left:1px solid var(--line);display:grid;grid-template-rows:auto 1fr;min-height:0}
.ptabs{display:flex;gap:2px;padding:12px 14px 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.ptabs::-webkit-scrollbar{display:none}
.ptabs button{position:relative;padding:10px 11px 13px;font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap;transition:color .2s}
.ptabs button::after{content:"";position:absolute;left:11px;right:11px;bottom:-1px;height:2px;background:var(--red);transform:scaleX(0);transition:transform .35s var(--ease)}
.ptabs button[aria-selected="true"]{color:var(--text)}
.ptabs button[aria-selected="true"]::after{transform:none}
.ptabs button:hover{color:var(--text)}
.pbody{overflow-y:auto;padding:6px 20px 28px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.grp{padding-block:18px;border-bottom:1px solid var(--line);display:grid;gap:12px}
.grp:last-child{border-bottom:0}
.pbody.anim .grp{animation:rise .55s var(--ease) both}
.pbody.anim .grp:nth-child(2){animation-delay:.05s}
.pbody.anim .grp:nth-child(3){animation-delay:.1s}
.pbody.anim .grp:nth-child(4){animation-delay:.15s}
@keyframes rise{from{transform:translateY(14px);opacity:.0}to{transform:none;opacity:1}}
.grp h3{margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-family:var(--mono);font-weight:600;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.grp h3 .val{font-family:var(--body);letter-spacing:0;text-transform:none;font-size:13px;color:var(--text);font-weight:600;text-align:right}
.note{margin:0;color:var(--muted);font-size:13px;max-width:60ch}

.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:6px}
.seg button{background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:9px 8px;font-weight:700;font-size:13px;display:grid;gap:1px;text-align:center;transition:border-color .2s,background .2s,transform .2s var(--ease)}
.seg button small{font-family:var(--mono);font-weight:400;font-size:9.5px;color:var(--muted)}
.seg button:hover{border-color:var(--line2);transform:translateY(-1px)}
.seg button.on{border-color:var(--red);background:rgba(227,38,47,.1);box-shadow:inset 0 0 0 1px var(--red)}

.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:10px}
.sw{position:relative;aspect-ratio:1;max-width:100%;border-radius:50%;box-shadow:inset 0 -6px 10px rgba(0,0,0,.35),inset 0 3px 5px rgba(255,255,255,.3),0 0 0 1px rgba(255,255,255,.08);transition:transform .25s var(--ease)}
.sw:hover{transform:scale(1.1)}
.sw.on{box-shadow:inset 0 -6px 10px rgba(0,0,0,.35),inset 0 3px 5px rgba(255,255,255,.3),0 0 0 2px var(--panel),0 0 0 4px var(--red)}
.sw.custom{background:conic-gradient(from 0deg,#ff3b3b,#ffd23b,#4bff6a,#3bd5ff,#6a4bff,#ff3bd2,#ff3b3b);cursor:pointer;display:grid;place-items:center}
.sw.custom input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;border:0;padding:0}
.sw.custom span{font-weight:800;font-size:18px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);pointer-events:none}

.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.card{background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;text-align:left;transition:border-color .2s,transform .25s var(--ease),background .2s}
.card:hover{border-color:var(--line2);transform:translateY(-2px)}
.card.on{border-color:var(--red);background:linear-gradient(180deg,rgba(227,38,47,.12),rgba(227,38,47,.03));box-shadow:inset 0 0 0 1px var(--red)}
.card svg{width:100%;max-width:84px;height:auto;justify-self:center;color:#d8d9dd;transition:transform .8s var(--ease)}
.card:hover svg{transform:rotate(36deg)}
.card b{font-size:14px}
.card small{font-family:var(--mono);font-size:10px;color:var(--muted)}
.card p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.35}
.card .row{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.cards.wide{grid-template-columns:1fr}
.cards.wide .card{grid-template-columns:auto 1fr;align-items:center}
.kicon{width:46px;height:46px;border-radius:10px;background:var(--bg2);display:grid;place-items:center;border:1px solid var(--line)}
.kicon svg{width:30px;max-width:30px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.card:hover .kicon svg{transform:none}

.slider{display:grid;gap:8px}
.slider .lab{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.slider .lab output{font-family:var(--mono);color:var(--text);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--red) var(--p,50%),var(--line2) var(--p,50%))}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--red) var(--p,50%),var(--line2) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-7px;border-radius:50%;background:#fff;border:4px solid var(--red);box-shadow:0 0 0 4px rgba(227,38,47,.18);transition:transform .2s}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:4px solid var(--red)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.15)}
.ticks{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--dim)}

/* ---------- garage drawer ---------- */
.garage{position:absolute;inset:0;z-index:6;background:var(--panel);display:grid;grid-template-rows:auto 1fr;transform:translateX(100%);transition:transform .5s var(--ease)}
.garage.open{transform:none}
.ghead{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.ghead h2{margin:0;font-family:var(--display);font-stretch:125%;font-weight:850;font-size:20px}
.ghead button{font-size:13px;font-weight:600;color:var(--muted);padding:6px 10px;border-radius:8px;border:1px solid var(--line)}
.ghead button:hover{color:var(--text);border-color:var(--line2)}
.glist{overflow-y:auto;padding:14px 20px;display:grid;gap:10px;align-content:start}
.gitem{background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;animation:rise .45s var(--ease) both}
.gitem i{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 -5px 8px rgba(0,0,0,.35),inset 0 3px 4px rgba(255,255,255,.3)}
.gitem b{display:block;font-size:14px}
.gitem small{display:block;color:var(--muted);font-size:12px}
.gitem .acts{display:flex;gap:6px}
.gitem .acts button{font-size:12px;font-weight:700;padding:7px 10px;border-radius:8px;background:var(--raise2)}
.gitem .acts button.load{background:var(--red);color:#fff}
.gempty{color:var(--muted);font-size:14px;padding:30px 4px;text-align:center}

.toast{position:fixed;left:50%;bottom:28px;z-index:60;transform:translate(-50%,30px);opacity:0;pointer-events:none;background:#fff;color:#111;font-weight:700;font-size:13px;padding:10px 16px;border-radius:10px;box-shadow:0 14px 40px -10px rgba(0,0,0,.6);transition:transform .45s var(--ease),opacity .3s}
.toast.show{transform:translate(-50%,0);opacity:1}

/* ---------- responsive ---------- */
@media (max-width:1100px){ .main{grid-template-columns:1fr 340px} .specbar{grid-template-columns:repeat(3,minmax(0,1fr))} .spec.price{grid-column:span 3} .spec.kg{display:none} .hint{bottom:150px} }
@media (max-width:860px){
  body{overflow:auto}
  .app{height:auto;min-height:100%}
  .main{grid-template-columns:1fr}
  .stage{height:68vh;min-height:440px}
  .panel{border-left:0;border-top:1px solid var(--line);min-height:70vh}
  .pbody{overflow:visible}
  .nbtn span{display:none}
  .nbtn{padding:8px}
  .top{padding:10px 16px}
  .tl{left:16px;top:14px;max-width:calc(100% - 32px)}
  .tr{right:16px;top:auto;bottom:162px}
  .specbar{left:16px;right:16px;bottom:14px}
  .hint{display:none}
  .credit{display:none}
  .garage{position:fixed;inset:0}
}
@media (max-width:520px){
  .brand span{font-size:16px} .cta{padding:10px 12px;margin-left:2px}
  .spec{padding:7px 10px} .spec output{font-size:16px} .spec label{font-size:9px} .spec .delta{display:none}
  .specbar{grid-template-columns:repeat(3,minmax(0,1fr))} .spec.price{grid-column:span 3;display:flex;justify-content:space-between;align-items:center}
  .ctabs{gap:18px}
  .views button{padding:6px 8px;font-size:11px}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>

  tires.forEach(o=>{tmp.setFromObject(o);const c=tmp.getCenter(new V3());const k=(c.x>0?'F':'R')+(c.z>0?'R':'L');
    const C=corners[k]||(corners[k]={box:new THREE.Box3(),meshes:[]});C.box.union(tmp);C.meshes.push(o);});
  // some models ship with the front wheels turned: find each tyre's real heading from its vertices
  function tyreHeading(C,c){
    let sxx=0,szz=0,sxz=0,n=0;const v=new V3();
    for(const o of C.meshes){const pos=o.geometry.attributes.position,step=Math.max(1,Math.floor(pos.count/4000));
      for(let i=0;i<pos.count;i+=step){v.fromBufferAttribute(pos,i).applyMatrix4(o.matrixWorld);const dx=v.x-c.x,dz=v.z-c.z;sxx+=dx*dx;szz+=dz*dz;sxz+=dx*dz;n++;}}
    if(!n)return {th:0,w:C.box.max.z-C.box.min.z};

    if(th>Math.PI/2)th-=Math.PI;if(th<-Math.PI/2)th+=Math.PI;

    for(const o of C.meshes){const pos=o.geometry.attributes.position,step=Math.max(1,Math.floor(pos.count/4000));
      for(let i=0;i<pos.count;i+=step){v.fromBufferAttribute(pos,i).applyMatrix4(o.matrixWorld);const p=(v.x-c.x)*ax+(v.z-c.z)*az;lo=Math.min(lo,p);hi=Math.max(hi,p);}}

  meshes.filter(o=>o.parent&&o.visible&&o.material===caliperMat).forEach(o=>{tmp.setFromObject(o);if(tmp.max.x-tmp.min.x>L*.4||tmp.max.z-tmp.min.z>.6)splitByQuadrant(o);});
  top.updateMatrixWorld(true);
  const all=[];scene.traverse(o=>{if(o.isMesh&&o.visible)all.push(o);});
  const wheels=[];
  for(const k of ['FL','FR','RL','RR']){
    const C=corners[k];if(!C)continue;const cb=C.box;
    const c=cb.getCenter(new V3()),r=(cb.max.y-cb.min.y)/2,hd=tyreHeading(C,c),w=hd.w;

  const moves=[];
  all.forEach(o=>{
    if(o.material===glbPaint||o.material===glbAccent||glass.includes(o.material))return;
    tmp.setFromObject(o);const c=tmp.getCenter(new V3()),sz=tmp.getSize(new V3());

  });
  moves.forEach(([o,W])=>{

  });

  top.updateMatrixWorld(true);

  box.makeEmpty();body.traverse(o=>{if(o.isMesh&&o.visible){tmp.setFromObject(o);box.union(tmp);}});

  const avg=(a,f)=>a.reduce((s,w)=>s+f(w),0)/Math.max(a.length,1);
  const tire=avg(wheels,w=>w.r)||.34;
  const info={tire,tireW:avg(wheels,w=>w.w)||.25,archR:tire*1.22,W:(box.max.z-box.min.z)*.96,g:box.min.y+.05,
    fx:avg(fr,w=>w.c.x)||1.3,rx:avg(rr,w=>w.c.x)||-1.3,contour:[[box.max.x,.3],[box.min.x,.3]],
    wing:{x:box.min.x+.32,h:Math.max(.16,H*.15)},podY:Math.max(.5,H*.45),glass:[[0,0],[box.min.x+(box.max.x-box.min.x)*.55,0]],
    stripe:[H*.56,H*.62],twoY:H*.49,H};

}

/* ================= GEOMETRY HELPERS ================= */
function creaseNormals(geo,deg){
  if(geo.index)geo=geo.toNonIndexed();
  const pos=geo.attributes.position,n=pos.count,cos=Math.cos(deg*Math.PI/180);
  const faceN=[],map=new Map(),a=new V3(),b=new V3(),c=new V3();
  const key=i=>Math.round(pos.getX(i)*1e4)+','+Math.round(pos.getY(i)*1e4)+','+Math.round(pos.getZ(i)*1e4);
  const keys=new Array(n);
  for(let f=0;f<n;f+=3){
    a.fromBufferAttribute(pos,f);b.fromBufferAttribute(pos,f+1);c.fromBufferAttribute(pos,f+2);
    const fn=new V3().crossVectors(b.sub(a),c.sub(a));faceN.push(fn);
    for(let k=0;k<3;k++){const K=key(f+k);keys[f+k]=K;let arr=map.get(K);if(!arr){arr=[];map.set(K,arr);}arr.push(fn);}
  }
  const out=new Float32Array(n*3),tmp=new V3(),un=new V3(),uo=new V3();
  for(let f=0;f<n;f+=3){
    un.copy(faceN[f/3]).normalize();
    for(let k=0;k<3;k++){tmp.set(0,0,0);for(const o of map.get(keys[f+k])){uo.copy(o).normalize();if(uo.dot(un)>cos)tmp.add(o);}
      if(tmp.lengthSq()===0)tmp.copy(un);tmp.normalize();const j=(f+k)*3;out[j]=tmp.x;out[j+1]=tmp.y;out[j+2]=tmp.z;}
  }
  geo.setAttribute('normal',new THREE.BufferAttribute(out,3));
  return geo;
}
function bodyGeo(d,W){
  const s=new THREE.Shape(),aR=d.archR,wy=.34,g=d.g,c=d.contour;
  const xf=c[0][0],xr=c[c.length-1][0];
  s.moveTo(xr+.02,g);
  s.lineTo(d.rx-aR,g);s.lineTo(d.rx-aR,wy);s.absarc(d.rx,wy,aR,Math.PI,0,true);s.lineTo(d.rx+aR,g);
  s.lineTo(d.fx-aR,g);s.lineTo(d.fx-aR,wy);s.absarc(d.fx,wy,aR,Math.PI,0,true);s.lineTo(d.fx+aR,g);
  s.lineTo(xf-.02,g);
  s.splineThru(c.map(p=>new V2(p[0],p[1])));
  s.closePath();
  const bt=.08,bs=.05,depth=W-2*bt;
  let geo=new THREE.ExtrudeGeometry(s,{depth,bevelEnabled:true,bevelThickness:bt,bevelSize:bs,bevelSegments:6,curveSegments:44,steps:1});
  geo.translate(0,0,-depth/2);
  const pos=geo.attributes.position;let xmax=-9,xmin=9;
  for(let i=0;i<pos.count;i++){xmax=Math.max(xmax,pos.getX(i));xmin=Math.min(xmin,pos.getX(i));}
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i),y=pos.getY(i);
    const k=clamp((y-.45)/.5,0,1);let f=1-.075*k*k;
    const nn=clamp((x-(xmax-.75))/.75,0,1);f*=1-.17*nn*nn;
    const t=clamp(((xmin+.55)-x)/.55,0,1);f*=1-.09*t*t;
    pos.setZ(i,pos.getZ(i)*f);
  }
  geo.deleteAttribute('uv');
  return creaseNormals(geo,38);
}
function glassGeo(d){
  const p=d.glass,s=new THREE.Shape();
  s.moveTo(p[0][0],p[0][1]);s.splineThru(p.slice(1).map(q=>new V2(q[0],q[1])));s.closePath();
  const bt=.06,depth=d.glassW-2*bt;
  let geo=new THREE.ExtrudeGeometry(s,{depth,bevelEnabled:true,bevelThickness:bt,bevelSize:.03,bevelSegments:5,curveSegments:40,steps:1});
  geo.translate(0,0,-depth/2);
  const pos=geo.attributes.position;let y0=9,y1=-9;
  for(let i=0;i<pos.count;i++){y0=Math.min(y0,pos.getY(i));y1=Math.max(y1,pos.getY(i));}
  for(let i=0;i<pos.count;i++){const t=clamp((pos.getY(i)-y0-.05)/(y1-y0),0,1);pos.setZ(i,pos.getZ(i)*(1-.3*t));}
  geo.deleteAttribute('uv');
  return creaseNormals(geo,40);
}
const M=(geo,mat,cast=true)=>{const m=new THREE.Mesh(geo,mat);m.castShadow=cast;return m;};
const rc=new THREE.Raycaster();
function hitAt(objs,o,d){rc.set(new V3(...o),new V3(...d).normalize());const h=rc.intersectObjects(objs,false)[0];return h?h.point:null;}
function disposeTree(o){o.traverse(n=>{if(n.geometry&&!n.geometry.userData.keep)n.geometry.dispose();});}

/* ================= WHEELS ================= */
const P=(r,a)=>[Math.cos(a)*r,Math.sin(a)*r];
function bar(A,B,wd,dp,z,mat){const dx=B[0]-A[0],dy=B[1]-A[1],L=Math.hypot(dx,dy);const m=M(new THREE.BoxGeometry(L,wd,dp),mat);m.position.set((A[0]+B[0])/2,(A[1]+B[1])/2,z);m.rotation.z=Math.atan2(dy,dx);return m;}
function makeWheel(design,inch,R,w,noBrake){
  if(design==='original')design='mono5';

  const sh=Math.min(.04,(R-r)*.45),pts=[];
  pts.push(new V2(r-.004,w*.5-.012),new V2(r+.012,w*.5));
  for(let i=0;i<=6;i++){const a=Math.PI/2-i/6*Math.PI/2;pts.push(new V2(R-sh+Math.cos(a)*sh,w/2-sh+Math.sin(a)*sh));}
  for(let i=1;i<=6;i++){const a=-i/6*Math.PI/2;pts.push(new V2(R-sh+Math.cos(a)*sh,-w/2+sh+Math.sin(a)*sh));}
  pts.push(new V2(r+.012,-w*.5),new V2(r-.004,-w*.5+.012));

  for(const zz of [-.25,0,.25]){const gr=new THREE.Mesh(new THREE.TorusGeometry(R+.0005,.006,4,96),trimMat);gr.position.z=zz*w;gr.scale.z=1.4;spin.add(gr);}
  spin.add(M(new THREE.CylinderGeometry(r-.008,r-.008,w*.9,56,1,true).rotateX(Math.PI/2),rimInner,false));
  const lip=M(new THREE.TorusGeometry(r-.004,.012,10,80),rimMat);lip.position.z=w*.45;spin.add(lip);
  const z0=w*.32;
  const hub=M(new THREE.CylinderGeometry(r*.24,r*.28,.05,32).rotateX(Math.PI/2),rimMat);hub.position.z=z0;spin.add(hub);
  for(let i=0;i<5;i++){const [x,y]=P(r*.15,i*Math.PI*2/5);const n=M(new THREE.CylinderGeometry(.011,.011,.03,10).rotateX(Math.PI/2),chromeMat,false);n.position.set(x,y,z0+.03);spin.add(n);}
  const cap=M(new THREE.CylinderGeometry(r*.09,r*.09,.02,28).rotateX(Math.PI/2),capMat,false);cap.position.z=z0+.035;spin.add(cap);
  const TAU=Math.PI*2;
  if(design==='mono5'){
    const s=new THREE.Shape();s.moveTo(r*.22,-.038);s.lineTo(r*.97,-.065);s.lineTo(r*.97,.065);s.lineTo(r*.22,.038);s.closePath();
    const g=new THREE.ExtrudeGeometry(s,{depth:.034,bevelEnabled:true,bevelThickness:.008,bevelSize:.008,bevelSegments:2});
    for(let i=0;i<5;i++){const grp=new THREE.Group();grp.rotation.z=i*TAU/5+Math.PI/2;const m=M(g,rimMat);m.rotation.y=-.13;m.position.z=z0-.035;grp.add(m);spin.add(grp);}
  }else if(design==='mesh'){
    for(let i=0;i<10;i++){const a=i*TAU/10;for(const sg of [-1,1])spin.add(bar(P(r*.26,a),P(r*.95,a+sg*.33),.017,.03,z0-.004,rimMat));}
    const ring=M(new THREE.TorusGeometry(r*.93,.012,6,64),rimMat);ring.position.z=z0-.01;spin.add(ring);
  }else if(design==='turbine'){
    for(let i=0;i<14;i++){const a=i*TAU/14;const m=bar(P(r*.26,a),P(r*.95,a+.6),.03,.045,z0-.008,rimMat);m.rotation.order='ZXY';m.rotation.x=.45;spin.add(m);}
    const back=M(new THREE.CircleGeometry(r*.94,48),rimInner,false);back.position.z=z0-.04;spin.add(back);
  }else if(design==='rally6'){
    for(let i=0;i<6;i++){const a=i*TAU/6+Math.PI/2;spin.add(bar(P(r*.2,a),P(r*.96,a),.078,.03,z0-.005,rimMat));}
    const ring=M(new THREE.TorusGeometry(r*.58,.014,8,64),rimMat);ring.position.z=z0;spin.add(ring);
    const back=M(new THREE.CircleGeometry(r*.94,48),rimInner,false);back.position.z=z0-.045;spin.add(back);
  }else{
    for(let i=0;i<5;i++){const a=i*TAU/5+Math.PI/2;spin.add(bar(P(r*.2,a),P(r*.56,a),.05,.034,z0,rimMat));
      for(const sg of [-1,1])spin.add(bar(P(r*.52,a),P(r*.96,a+sg*.2),.03,.03,z0-.006,rimMat));}

  const cs=new THREE.Shape();cs.absarc(0,0,r*.88,-.36,.36,false);cs.absarc(0,0,r*.6,.36,-.36,true);cs.closePath();

  caliper.position.z=-.045;
  return {spin,caliper};
}

      const steer=root.getObjectByName('RL_STEER'),camb=root.getObjectByName('RL_CAMB'),spin=root.getObjectByName('RL_SPIN');
      const orig=[];spin.traverse(o=>{if(o.isMesh&&o.userData.rlOrig)orig.push(o);});
      const w={root,steer,camb,spin,side:u.side,front:u.front,glb:true,orig,proc:null,r:u.r,w:u.w};
      setGlbRim(w,false);wheels.push(w);
    }
  }else if(model){
    // lift the model's own wheels out of the body so ride height, steering and camber act on them separately
    const nodes=[];tpl.traverse(o=>{if(/^Wheel(Front|Rear)(L|R)$/.test(o.name))nodes.push(o);});
    for(const wn of nodes){
      const p=car.worldToLocal(wn.getWorldPosition(new V3())),qp=wn.parent.getWorldQuaternion(new THREE.Quaternion());
      const side=Math.sign(wn.position.x)||1;
      wn.parent.remove(wn);
      const root=new THREE.Group();root.position.copy(p);root.quaternion.copy(qp);
      if(wide)root.position.z+=Math.sign(p.z)*.07;
      const steer=new THREE.Group(),camb=new THREE.Group();root.add(steer);steer.add(camb);
      wn.position.set(0,0,0);wn.quaternion.identity();camb.add(wn);
      const orig=[];
      wn.children.slice().forEach(c=>{if(/BrakePad/.test(c.name)){wn.remove(c);camb.add(c);}else if(!/BrakeDisc/.test(c.name))orig.push(c);});
      const w={root,steer,camb,spin:wn,side,front:/Front/.test(wn.name),model:true,orig,proc:null};

  }else
  for(const [x,front] of [[d.fx,true],[d.rx,false]])for(const side of [1,-1]){
    const root=new THREE.Group();root.position.set(x,d.tire,side*zHalf);
    const steer=new THREE.Group(),camb=new THREE.Group(),flip=new THREE.Group();
    root.add(steer);steer.add(camb);camb.add(flip);if(side<0)flip.rotation.y=Math.PI;
    const w=makeWheel(cfg.rim,rimSize,d.tire,tw);flip.add(w.spin);flip.add(w.caliper);
    w.caliper.rotation.z=(side>0?.62:.38)*Math.PI;
    car.add(root);wheels.push({root,steer,camb,spin:w.spin,side,front});
  }
  applyCamber();
  contact.scale.set((d.contour[0][0]-d.contour[d.contour.length-1][0])*1.28,W*1.55,1);
  scene.add(car);
}

    nw.spin.rotation.y=w.side>0?Math.PI/2:-Math.PI/2;w.spin.add(nw.spin);w.proc=nw.spin;}

    const nw=makeWheel(cfg.rim,cfg.rimSize,d.tire,tw);nw.spin.rotation.z=w.spin.rotation.z;flip.add(nw.spin);flip.add(nw.caliper);

function distScale(){const a=camera.aspect;return a<.8?1.75:a<1.15?1.4:a<1.45?1.15:1;}
function flyTo(name,dur=1.4){
  const v=VIEWS[name];if(!v)return;if(camTween)camTween.dead=true;
  const t1=new V3(...v.t),t0=controls.target.clone();

  const o1=new THREE.Spherical().setFromVector3(new V3(...v.p).sub(t1));o1.radius*=distScale();
  let dth=o1.theta-o0.theta;dth=Math.atan2(Math.sin(dth),Math.cos(dth));
  flying=true;
  camTween=tween(dur,e=>{const s=new THREE.Spherical(o0.radius+(o1.radius-o0.radius)*e,o0.phi+(o1.phi-o0.phi)*e,o0.theta+dth*e);
    controls.target.lerpVectors(t0,t1,e);camera.position.setFromSpherical(s).add(controls.target);},easeIO,()=>{flying=false;});

  document.querySelectorAll('#ptabs button').forEach(x=>x.setAttribute('aria-selected',x===b));renderPanel(true);pbody.scrollTop=0;if(!busy)flyTo(TAB_VIEW[tab]);});
pbody.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const v=b.dataset.v,act=b.dataset.act;
  if(act==='color'){if(cfg.color===v)return;cfg.color=v;cfg.colorName=b.dataset.n;paintTo(v);}
  else if(act==='finish'){cfg.finish=v;finishTo(v);pulse();}
  else if(act==='tint'){cfg.tint=v;applyStatic();}
  else if(act==='rim'){if(cfg.rim===v)return;cfg.rim=v;rebuildWheelsOnly();flyTo('wheels');}
  else if(act==='rimfin'){cfg.rimFin=v;applyStatic();pulse();}
  else if(act==='caliper'){cfg.caliper=v;applyStatic();}
  else if(act==='kit'){if(cfg.kit===v)return;cfg.kit=v;const x=car.position.x;buildCar();car.position.x=x;applyStatic();bump(-.7,.02);pulse();flyTo(v==='track'?'rear':'overview');}
  else if(act==='livery'){cfg.livery=v;applyStatic();pulse();}
  else if(act==='livcol'){cfg.livColor=v;cfg.livName=b.dataset.n;if(cfg.livery==='none'){cfg.livery=BODIES[cfg.body].cls==='rally'?'slash':'twin';}applyStatic();pulse();}
  else if(act==='accent'){cfg.accent=v;cfg.accentName=b.dataset.n;applyStatic();pulse();}
  refreshUI(false);
});
pbody.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='customColor'){cfg.color=t.value;cfg.colorName='Custom '+t.value.toUpperCase();paintMat.color.set(t.value);modelPaint.color.set(t.value);glbPaint.color.set(t.value);accMat.color.set(t.value);shownColor.set(t.value);updateHero();updateSpecs();return;}
  if(t.type!=='range')return;
  t.style.setProperty('--p',(t.value-t.min)/(t.max-t.min)*100+'%');
  const v=+t.value,o=$('#'+t.id+'-o');
  if(t.id==='ride'){cfg.ride=v;o.textContent=fmtRide(v);}
  if(t.id==='camber'){cfg.camber=v;o.textContent=fmtCam(v);applyCamber();}
  if(t.id==='rimSize'){cfg.rimSize=v;o.textContent=fmtIn(v);rebuildWheelsOnly();}
  updateSpecs();
});
pbody.addEventListener('change',e=>{if(e.target.id==='customColor'){paintTo(e.target.value);renderPanel(false);} if(e.target.id==='ride')bump(-.3);});

/* class tabs */
const ctabs=$('#ctabs'),cind=$('#cind');
function moveInd(){const b=ctabs.querySelector('[aria-selected="true"]');cind.style.left=b.offsetLeft+'px';cind.style.width=b.offsetWidth+'px';}
const lastPick={};
ctabs.addEventListener('click',e=>{const b=e.target.closest('[data-body]');if(!b||busy)return;const cls=b.dataset.body;if(cls===BODIES[cfg.body].cls)return;
  let id=lastPick[cls]||CLASSES[cls][0];if(isModel(id)&&modelFailed)id=CLASSES[cls].find(x=>!isModel(x));switchBody(id);});
const mpick=$('#mpick');
function renderPick(){
  const cls=BODIES[cfg.body].cls;
  mpick.innerHTML=CLASSES[cls].map(id=>{const d=BODIES[id];const dis=(isModel(id)&&modelFailed)||(isGlb(id)&&GLB_FAILED[d.car]);
    return `<button data-car="${id}" aria-pressed="${id===cfg.body}" ${dis?'disabled':''} title="${d.sub}"><i></i>${d.short||d.name}</button>`;}).join('');
}
mpick.addEventListener('click',e=>{const b=e.target.closest('[data-car]');if(!b||busy||b.dataset.car===cfg.body)return;switchBody(b.dataset.car);});
$('#views').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b)flyTo(b.dataset.view);});

/* hero + bg word */
const bgword=$('#bgword');
function bgOut(){bgword.classList.add('out');}
function setBgWord(t){bgword.innerHTML=[...t].map((c,i)=>`<span style="transition-delay:${i*35}ms">${c===' '?'&nbsp;':c}</span>`).join('');bgword.classList.add('out');requestAnimationFrame(()=>requestAnimationFrame(()=>bgword.classList.remove('out')));}
function updateHero(full){
  const d=BODIES[cfg.body];
  if(full){$('#eyebrow').textContent=d.sub;let ci=0;$('#model').innerHTML=d.name.split(' ').map(w=>'<span class="wd">'+[...w].map(c=>`<span class="ch" style="animation-delay:${(ci++)*40}ms">${c}</span>`).join('')+'</span>').join(' ');setBgWord(d.name);}
  const chip=$('#paintChip');chip.querySelector('i').style.background=cfg.color;
  chip.querySelector('span').innerHTML=`${cfg.colorName} <small>· ${FINISHES[cfg.finish].label}${cfg.livery!=='none'?' · '+LIVERIES[cfg.livery]:''}</small>`;
}
function specs(){
  const d=BODIES[cfg.body],k=KITS[cfg.kit],s=Object.assign({},d.spec),di=cfg.rim==='original'?0:cfg.rimSize-DEF[cfg.body].rimSize;
  s.hp+=k.hp;s.acc+=k.acc;s.top+=k.top;s.kg+=k.kg;s.price+=k.price;
  s.kg+=di*6;s.acc+=di*.015;s.top-=Math.max(0,cfg.ride)*.06;
  s.price+=Math.max(0,di)*900+RIMS[cfg.rim].price+FINISHES[cfg.finish].price+(cfg.livery!=='none'?3500:0)+TINTS[cfg.tint].price+(cfg.caliper!==DEF[cfg.body].caliper?850:0)+RIM_FIN[cfg.rimFin].price;
  s.acc=Math.max(1.9,s.acc);return s;
}
const shown={hp:0,acc:0,top:0,kg:0,price:0};let specT=null;
const SPEC_FMT={hp:v=>Math.round(v)+'<small>hp</small>',acc:v=>v.toFixed(1)+'<small>s</small>',top:v=>Math.round(v)+'<small>km/h</small>',kg:v=>Math.round(v).toLocaleString('en-US')+'<small>kg</small>',price:v=>money(v)};
function updateSpecs(){
  const s=specs(),from=Object.assign({},shown);
  for(const k in s){const diff=s[k]-from[k];const el=$('#dl-'+k);if(from.price&&Math.abs(diff)>(k==='acc'?.04:.5)){
    const good=k==='acc'||k==='kg'?diff<0:diff>0;el.textContent=(diff>0?'▲ ':'▼ ')+(k==='price'?money(Math.abs(diff)):k==='acc'?Math.abs(diff).toFixed(2)+' s':Math.round(Math.abs(diff)));
    el.style.color=k==='price'?'var(--muted)':good?'#7ddc72':'var(--red2)';el.style.opacity=1;clearTimeout(el._t);el._t=setTimeout(()=>el.style.opacity=0,2200);}}
  if(specT)specT.dead=true;
  specT=tween(.7,e=>{for(const k in s){shown[k]=from[k]+(s[k]-from[k])*e;$('#sp-'+k).innerHTML=SPEC_FMT[k](shown[k]);}},easeOut);
}
const DISCLAIMER='Fan project, not affiliated with or endorsed by any carmaker. Names and designs belong to their owners. Figures are approximate.';
function setCredit(){
  const el=$('#credit'),d=BODIES[cfg.body];
  if(isModel(cfg.body))el.innerHTML='Concept 04 model: “Car Concept” by Eric Chadwick, Darmstadt Graphics Group, from a public-domain car by Unity Fan. <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>. Logos removed, materials recoloured.';
  else if(isGlb(cfg.body)){const g=GLB[d.car];const lic={'CC BY 4.0':'by/4.0','CC BY-NC 4.0':'by-nc/4.0','CC BY-NC-SA 4.0':'by-nc-sa/4.0'}[g.lic];
    el.innerHTML='Model: <a href="'+g.url+'" target="_blank" rel="noopener">“'+g.title+'”</a> by '+g.author+', <a href="https://creativecommons.org/licenses/'+lic+'/" target="_blank" rel="noopener">'+g.lic+'</a>. Simplified and recoloured. '+DISCLAIMER;}
  el.hidden=!isDetailed(cfg.body);
}
function refreshUI(full){
  if(full){const cls=BODIES[cfg.body].cls;lastPick[cls]=cfg.body;ctabs.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',b.dataset.body===cls));moveInd();
    renderPick();setCredit();}
  updateHero(full);renderPanel(full);updateSpecs();
}

/* ================= TOP BAR ================= */
const btnDrive=$('#btnDrive'),btnLights=$('#btnLights');
btnDrive.addEventListener('click',()=>{driving=!driving;btnDrive.setAttribute('aria-pressed',driving);if(driving)flyTo('overview');});
btnLights.addEventListener('click',()=>{lightsOn=!lightsOn;btnLights.setAttribute('aria-pressed',lightsOn);});
const toastEl=$('#toast');let toastT;
function toast(m){toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove('show'),2200);}
const GKEY='redline-garage-v1';
function loadGarage(){try{return JSON.parse(localStorage.getItem(GKEY))||[];}catch(e){return[];}}
function saveGarage(l){try{localStorage.setItem(GKEY,JSON.stringify(l));return true;}catch(e){return false;}}
let garageList=loadGarage();
function renderGarage(){
  const c=$('#gCount');c.textContent=garageList.length||'';c.dataset.n=garageList.length;
  $('#glist').innerHTML=garageList.length?garageList.map((g,i)=>`<div class="gitem"><i style="background:${g.cfg.color}"></i><div><b>${BODIES[g.cfg.body].name}</b><small>${g.cfg.colorName} · ${g.cfg.rimSize}″ ${RIMS[g.cfg.rim].name} · ${KITS[g.cfg.kit].name}</small><small>${money(g.price)}</small></div><div class="acts"><button class="load" data-load="${i}">Load</button><button data-del="${i}" aria-label="Remove build">✕</button></div></div>`).join('')
    :'<div class="gempty">No saved builds yet.<br>Spec a car, then press <b>+ Save build</b>.</div>';
}
$('#btnSave').addEventListener('click',()=>{
  garageList.unshift({cfg:Object.assign({},cfg),price:specs().price,t:Date.now()});garageList=garageList.slice(0,12);
  const ok=saveGarage(garageList);renderGarage();toast(ok?'Build saved to your garage':'Saved for this visit only');pulse();
  const c=$('#gCount');c.animate&&c.animate([{transform:'scale(1.8)'},{transform:'scale(1)'}],{duration:500,easing:'cubic-bezier(.22,1,.36,1)'});
});
const garageEl=$('#garage');
function openGarage(o){if(o){garageEl.hidden=false;requestAnimationFrame(()=>requestAnimationFrame(()=>garageEl.classList.add('open')));}
  else{garageEl.classList.remove('open');setTimeout(()=>{if(!garageEl.classList.contains('open'))garageEl.hidden=true;},520);}}
$('#btnGarage').addEventListener('click',()=>openGarage(garageEl.hidden));
$('#gClose').addEventListener('click',()=>openGarage(false));
$('#glist').addEventListener('click',e=>{
  const l=e.target.closest('[data-load]'),d=e.target.closest('[data-del]');
  if(l){const g=garageList[+l.dataset.load];openGarage(false);
    if(g.cfg.body!==cfg.body)switchBody(g.cfg.body,g.cfg);
    else{const prevColor=cfg.color;cfg=Object.assign({},g.cfg);const x=car.position.x;buildCar();car.position.x=x;applyStatic();finishTo(cfg.finish);if(prevColor!==cfg.color)paintTo(cfg.color);bump(-.6);refreshUI(false);}
    toast('Build loaded');}
  if(d){garageList.splice(+d.dataset.del,1);saveGarage(garageList);renderGarage();}
});

/* ================= RESIZE & LOOP ================= */
function resize(){const w=wrap.clientWidth,h=wrap.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=camera.aspect<1?38:30;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(wrap);addEventListener('resize',moveInd);
const clock=new THREE.Clock();let tAll=0;
function loop(){
  const dt=Math.min(clock.getDelta(),.05);tAll+=dt;
  for(let i=tweens.length-1;i>=0;i--){const t=tweens[i];if(t.dead){tweens.splice(i,1);continue;}t.t+=dt;const p=Math.min(1,t.t/t.dur);t.fn(t.ease(p));if(p>=1){tweens.splice(i,1);t.done&&t.done();}}
  // suspension spring
  spring.v+=(-190*spring.y-9*spring.v)*dt;spring.y+=spring.v*dt;
  spring.pv+=(-160*spring.p-8*spring.pv)*dt;spring.p+=spring.pv*dt;
  curBase+=(baseY()-curBase)*Math.min(1,dt*6);
  // drive
  driveV+=((driving?24:0)-driveV)*Math.min(1,dt*(driving?1.2:2));
  const vib=driveV>1?Math.sin(tAll*47)*.0016*(driveV/24)+Math.sin(tAll*13)*.0012:0;
  if(chassis){chassis.position.y=curBase+spring.y*.04+vib;chassis.rotation.z=spring.p+(driving?-.004*(driveV/24):0);}
  wheelSpin+=driveV*dt/BODIES[cfg.body].tire;
  steerCur+=(steerTarget-steerCur)*Math.min(1,dt*4);
  for(const w of wheels){
    if(w.model){w.spin.rotation.x=wheelSpin;w.steer.rotation.z=w.front?steerCur:0;}
    else if(w.glb){w.spin.rotation.z=-wheelSpin;w.steer.rotation.y=w.front?steerCur:0;}
    else{w.spin.rotation.z=w.side>0?-wheelSpin:wheelSpin;w.steer.rotation.y=w.front?steerCur:0;}}
  if(chassis)chassis.getWorldPosition(U.uOrigin.value);
  const dk=driveV/24;
  streakMat.opacity=.45*dk;dashMat.opacity=.5*dk;
  if(dk>.01){for(let i=0;i<STREAKS;i++){const s=streakData[i];s.x-=driveV*dt*(1+s.l*.3);if(s.x<-13){s.x=13;}
      const j=i*6,len=s.l*(.3+dk);streakPos[j]=s.x;streakPos[j+1]=s.y;streakPos[j+2]=s.z;streakPos[j+3]=s.x+len;streakPos[j+4]=s.y;streakPos[j+5]=s.z;}
    streakGeo.attributes.position.needsUpdate=true;
    dashes.children.forEach(d=>{d.position.x-=driveV*dt;if(d.position.x<-8)d.position.x+=16;});}
  deckMarks.rotation.z+=dt*(.03+dk*.6);
  // lights
  lightK+=((lightsOn?1:0)-lightK)*Math.min(1,dt*5);
  headMat.emissiveIntensity=lightK*2.6;tailMat.emissiveIntensity=.4+lightK*2.2;beam.material.opacity=lightK*.9;
  if(modelMats.head){modelMats.head.emissiveIntensity=modelMats.head.userData.base*(.04+.96*lightK);modelMats.brake.emissiveIntensity=modelMats.brake.userData.base*(.25+.75*lightK);}
  if(isGlb(cfg.body)&&GLB_TPL[BODIES[cfg.body].car]){const Lt=GLB_TPL[BODIES[cfg.body].car].lights;
    Lt.head.forEach(m=>m.emissiveIntensity=m.userData.base*lightK);Lt.tail.forEach(m=>m.emissiveIntensity=m.userData.base*(.3+.7*lightK));}
  if(car){beam.position.x=car.position.x+BODIES[cfg.body].contour[0][0]+1.5;contact.position.x=car.position.x;}
  edgeRing.material.color.setRGB(1,.23+.08*Math.sin(tAll*2),.25);
  // idle auto rotate
  controls.autoRotate=!reduce&&!flying&&!busy&&performance.now()-lastInteract>7000;
  if(!flying)controls.update();else camera.lookAt(controls.target);
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}

/* ================= BOOT ================= */
const lbar=$('#lbar'),lpct=$('#lpct');
const steps=['Warming tyres','Mixing paint','Torquing lug nuts','Polishing the clear coat','Rolling onto the deck'];
let si=0;const stepT=setInterval(()=>{si=Math.min(si+1,steps.length-1);lpct.textContent=steps[si];},700);
lbar.style.width='6%';
renderGarage();
resize();requestAnimationFrame(loop);
if(/[?&]debug\b/.test(location.search))window.__rl={scene,get car(){return car},get cfg(){return cfg},glbPaint,paintMat,GLB_TPL,renderer,switchBody,loadGlb};
function start(){
  buildCar();applyStatic();setFinishAll(FINISHES[cfg.finish]);paintTo(cfg.color,true);curBase=baseY();
  car.position.x=11;refreshUI(true);
  clearInterval(stepT);lbar.style.width='100%';
  setTimeout(()=>{$('#loader').classList.add('done');setTimeout(()=>{$('#loader').hidden=true;},900);
    flyTo('overview',2.4);lightsOn=false;driveIn(()=>{
      // headlight flicker on
      let n=0;const f=setInterval(()=>{lightsOn=!lightsOn;if(++n>=5){clearInterval(f);lightsOn=true;}},110);
    });
  },300);
}
const fallback=()=>{cfg=Object.assign({body:'sports'},DEF.sports);start();setTimeout(()=>toast('The detailed model could not load. Showing Vanta GT.'),1600);};
const giveUp=setTimeout(()=>{if(!modelTpl){modelFailed=true;fallback();}},45000);
loadModel(p=>{lbar.style.width=Math.max(6,Math.round(p*96))+'%';})
  .then(()=>{clearTimeout(giveUp);if(!car)start();})
  .catch(()=>{clearTimeout(giveUp);if(!car)fallback();});
document.fonts&&document.fonts.ready.then(moveInd);
})();
</script>
